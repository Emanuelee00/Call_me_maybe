[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "llm-sdk",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
]

[tool.uv.workspace]
members = [
    "attachments_project_ai/llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.black]
line-length = 79
target-version = ["py314"]

[dependency-groups]
dev = [
    "black>=26.5.1",
]
