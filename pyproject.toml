[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "llm-sdk",
    "pydantic>=2.13.4",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.black]
line-length = 79
target-version = ["py314"]

[tool.mypy]
exclude = ["^llm_sdk/"]

[[tool.mypy.overrides]]
module = "llm_sdk"
ignore_missing_imports = true
follow_imports = "skip"

[dependency-groups]
dev = [
    "black>=26.5.1",
]
